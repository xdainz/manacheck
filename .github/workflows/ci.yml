name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun ci
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test --run
      - name: Build
        run: bun run build
