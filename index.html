<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/ios_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manacheck</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Cascadia+Mono:ital,wght@0,200..700;1,200..700&display=swap");
    </style>
    <meta property="og:image" content="/manacheck_web.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:title" content="Manacheck" />
    <meta property="og:description" content="Web utility to filter card lists." />
    <meta property="og:url" content="https://xdainz.github.io/manacheck/" />
    <meta property="og:type" content="website" />
</head>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
        <filter id="foil-shift" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.002 0.004" numOctaves="1" seed="7" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"
                result="displaced" />
            <feColorMatrix in="displaced" type="saturate" values="2.2" />
        </filter>
    </svg>

    <div id="root"></div>
    <script type="text/javascript">
        // GitHub Pages SPA fallback (https://github.com/rafgraph/spa-github-pages)
        // Restores the URL that public/404.html encoded into the query
        // string, so deep links survive a hard refresh on GH Pages.
        (function (l) {
            if (l.search[1] === "/") {
                var decoded = l.search
                    .slice(1)
                    .split("&")
                    .map(function (s) {
                        return s.replace(/~and~/g, "&");
                    })
                    .join("?");
                window.history.replaceState(
                    null,
                    null,
                    l.pathname.slice(0, -1) + decoded + l.hash,
                );
            }
        })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
